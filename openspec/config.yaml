schema: spec-driven
context: |
    语言: 简体中文
    使用简体中文撰写所有内容, 除了以下情况:
    - 保留技术术语如 "API", "REST", "GraphQL" 为英文
    - 保留英文大写的规范术语 (如 "SHALL", "WHEN", "THEN") 为英文
    - 保留章节标题 (如 "Goals", "Non-goals", "Tasks") 为英文
    - 保留代码块和文件路径为其原始格式

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
